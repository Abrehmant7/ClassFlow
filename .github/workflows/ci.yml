name: ClassFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest

    env:
      CLASSFLOW_PROJECT_NAME: ClassFlow
      CLASSFLOW_ENVIRONMENT: ci
      CLASSFLOW_DEBUG: "false"
      CLASSFLOW_API_V1_PREFIX: /api/v1
      CLASSFLOW_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/classflow_ci
      CLASSFLOW_SECRET_KEY: ci-only-secret-key-change-for-production
      CLASSFLOW_JWT_ALGORITHM: HS256
      CLASSFLOW_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CLASSFLOW_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CLASSFLOW_PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: "30"
      CLASSFLOW_FRONTEND_PASSWORD_RESET_URL: http://localhost:5173/reset-password
      CLASSFLOW_CORS_ORIGINS: '["http://localhost:5173"]'
      CLASSFLOW_VECTOR_STORE_PROVIDER: pgvector

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest

      - name: Check Alembic migration graph
        run: python -m alembic heads

      - name: Compile Alembic offline upgrade SQL
        run: python -m alembic upgrade head --sql > /tmp/classflow_migrations.sql

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
