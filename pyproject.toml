[project]
name = "classflow"
version = "0.1.0"
description = "AI-powered academic coordination platform backend."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.14.0",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
]
rag = [
    "pypdf>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
